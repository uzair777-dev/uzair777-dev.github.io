<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editorial XML composer and live preview studio for Uzair Shaikh's devLOGS.">
    <title>devLOGS — XML Composer</title>
    <link rel="icon" type="image/png" href="/res/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var resolved = (saved === 'light' || saved === 'dark') ? saved :
                    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                var pal = localStorage.getItem('themeActivePalette') || localStorage.getItem('themePalette') || 'jade';
                document.documentElement.setAttribute('data-theme', resolved);
                document.documentElement.setAttribute('data-palette', pal);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <script src="/theme-engine.js" defer></script>
    <style>
        /* ═══════════════════════════════════════════════════════════
           devLOGS Editorial XML Composer
           Archival Print Broadsheet (Light) / Obsidian Press (Dark)
           ═══════════════════════════════════════════════════════════ */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── Top Bar ── */
        .editor-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-light);
            border-top: 2px solid transparent;
            border-image: linear-gradient(90deg, var(--accent), var(--accent-2)) 1 0 0 0;
            border-bottom: 1.5px solid var(--border-color);
            padding: 0.75rem 1.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .editor-brand {
            display: inline-flex;
            align-items: baseline;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--ink);
            white-space: nowrap;
        }

        .editor-brand-mark {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--ink);
        }

        .editor-brand-mark span {
            color: var(--accent);
        }

        .editor-brand-sep {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .editor-brand-sub {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-light);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .topbar-select-wrap {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .topbar-select-label {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-light);
            white-space: nowrap;
        }

        .topbar-select {
            padding: 0.42rem 0.65rem;
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-color);
            background: var(--bg-color);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            max-width: 210px;
        }

        .topbar-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.44rem 0.85rem;
            font-family: var(--font-mono);
            font-size: 0.76rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-color);
            background: var(--bg-color);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: 0 3px 0 0 var(--card-extrude), inset 0 1px 0 0 var(--surface-highlight);
            text-decoration: none;
            white-space: nowrap;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.14s ease, border-color 0.14s ease;
        }

        .topbar-link:hover {
            background: var(--hover-color);
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 0 0 var(--accent-extrude), inset 0 1px 0 0 var(--surface-highlight);
        }

        .topbar-link:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 0 var(--card-extrude);
        }

        /* ── Main Split Workspace ── */
        @media (min-width: 961px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
        }

        .editor-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .editor-pane,
        .preview-pane {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .editor-pane {
            background: var(--bg-light);
            border-right: 1.5px solid var(--border-color);
        }

        .preview-pane {
            background: var(--bg-color);
        }

        .pane-header {
            padding: 0.85rem 1.75rem;
            border-bottom: 1px solid var(--border-hairline);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-shrink: 0;
            background: var(--bg-light);
        }

        .preview-pane .pane-header {
            background: var(--bg-subtle);
        }

        .pane-title {
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.11em;
            color: var(--text-light);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .pane-title-index {
            color: var(--accent);
            font-weight: 600;
        }

        .pane-title-index::before {
            content: '// ';
            content: '// ' / '';
            color: var(--accent-2);
        }

        .pane-meta {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .pane-header-actions {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pane-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.75rem 2.25rem;
        }

        /* ── Form Controls ── */
        .field-group {
            margin-bottom: 1.15rem;
        }

        .field-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
            gap: 1rem;
        }

        .field-row-3 {
            display: grid;
            grid-template-columns: 1.15fr 1fr 0.85fr;
            gap: 0.9rem;
        }

        .field-group label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-color);
            margin-bottom: 0.42rem;
        }

        .field-group label .req {
            color: var(--accent);
        }

        .field-group label .hint {
            font-family: var(--font-body);
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .field-group input,
        .field-group textarea,
        .field-group select {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            font-size: 0.94rem;
            line-height: 1.45;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        [data-theme="dark"] .field-group input,
        [data-theme="dark"] .field-group textarea,
        [data-theme="dark"] .field-group select {
            color-scheme: dark;
        }

        .field-group input::placeholder,
        .field-group textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.85;
        }

        .field-group input:focus,
        .field-group textarea:focus,
        .field-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
            background: var(--bg-light);
        }

        .field-group textarea {
            resize: vertical;
            min-height: 76px;
        }

        .field-group textarea.content-area {
            min-height: 230px;
            font-family: var(--font-mono);
            font-size: 0.84rem;
            line-height: 1.65;
        }

        /* ── Tag Insert Bar ── */
        .tag-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.28rem;
            padding: 0.45rem;
            background: var(--bg-subtle);
            border: 1.5px solid var(--border-color);
            border-bottom: none;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }

        .tag-bar + textarea.content-area {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        .tag-btn {
            padding: 0.26rem 0.44rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--bg-light);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.12s ease, color 0.12s ease, transform 0.12s ease;
        }

        .tag-btn:hover {
            background: var(--ink);
            color: var(--bg-light);
            transform: translateY(-1px);
        }

        .tag-btn.custom {
            border-color: var(--accent);
            color: var(--accent);
        }

        .tag-btn.custom:hover {
            background: var(--accent);
            color: var(--accent-ink);
        }

        /* ── Action Buttons ── */
        .actions {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding-top: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.62rem 1.15rem;
            font-family: var(--font-body);
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 0 0 var(--card-extrude), inset 0 1px 0 0 var(--surface-highlight);
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 0 0 var(--card-extrude), inset 0 1px 0 0 var(--surface-highlight);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 var(--card-extrude);
        }

        .btn-sm {
            padding: 0.36rem 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 3px 0 0 var(--card-extrude);
        }

        .btn-sm:hover {
            box-shadow: 0 4px 0 0 var(--accent-extrude);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--btn-extrude);
            box-shadow: 0 4px 0 0 var(--btn-extrude), inset 0 1px 0 0 var(--surface-highlight);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 5px 0 0 var(--btn-extrude), inset 0 1px 0 0 var(--surface-highlight);
        }

        .btn-primary:active {
            box-shadow: 0 1px 0 0 var(--btn-extrude);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background: var(--hover-color);
            border-color: var(--accent);
            box-shadow: 0 5px 0 0 var(--accent-extrude);
        }

        .btn-danger {
            background: var(--bg-light);
            color: #c83363;
            border-color: #c83363;
            box-shadow: 0 4px 0 0 #942347;
        }

        [data-theme="dark"] .btn-danger {
            color: #ff8aa8;
            border-color: #ff8aa8;
            box-shadow: 0 4px 0 0 #a34d65;
        }

        .btn-danger:hover {
            background: #c83363;
            color: #ffffff;
            border-color: #942347;
            box-shadow: 0 5px 0 0 #942347;
        }

        [data-theme="dark"] .btn-danger:hover {
            background: #ff8aa8;
            color: #11121e;
            border-color: #a34d65;
            box-shadow: 0 5px 0 0 #a34d65;
        }

        /* ── Live Preview Article (Matches /devlogs/ Reader) ── */
        .preview-card {
            position: relative;
            background: var(--bg-light);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            padding: 2rem 2.1rem;
            margin-bottom: 1.75rem;
            overflow: hidden;
        }

        .preview-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 38%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
        }

        .preview-kicker {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.45rem;
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-light);
            margin-bottom: 0.85rem;
        }

        .preview-kicker-id {
            color: var(--accent);
            font-weight: 600;
        }

        .preview-kicker-sep {
            color: var(--text-muted);
        }

        .preview-heading {
            font-family: var(--font-display);
            font-size: clamp(1.55rem, 2.3vw, 2.05rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.15;
            color: var(--ink);
            margin: 0 0 0.85rem;
        }

        .preview-desc {
            font-size: 1.02rem;
            line-height: 1.65;
            color: var(--text-light);
            margin: 0 0 1.25rem;
        }

        .preview-content {
            font-size: 0.98rem;
            line-height: 1.82;
            color: var(--text-color);
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-hairline);
            word-break: break-word;
        }

        .preview-content img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-hairline);
            margin: 1.1rem 0;
            display: block;
        }

        .preview-content a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: 600;
        }

        .preview-content hr {
            border: none;
            height: 1px;
            background: var(--border-hairline);
            margin: 1.75rem 0;
        }

        .preview-content ul,
        .preview-content ol {
            padding-left: 1.45rem;
            margin: 0.8rem 0;
        }

        .preview-content li {
            margin: 0.35rem 0;
        }

        .preview-content ul li::marker {
            color: var(--accent);
        }

        .preview-content blockquote {
            margin: 1.15rem 0;
            padding: 0.85rem 1.25rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-sm);
            font-style: italic;
            color: var(--text-light);
        }

        .preview-content code {
            background: var(--bg-subtle);
            padding: 0.14rem 0.42rem;
            border-radius: 3px;
            font-size: 0.86em;
            font-family: var(--font-mono);
            border: 1px solid var(--border-hairline);
        }

        .preview-content p {
            margin: 0.75rem 0;
        }

        .preview-content p:first-child {
            margin-top: 0;
        }

        .preview-content br {
            display: block;
            content: "";
            margin-top: 0.45rem;
        }

        .censor-text {
            letter-spacing: 0;
            user-select: none;
            color: var(--ink);
        }

        .glitch-preview {
            display: inline-block;
            font-family: var(--font-mono);
            letter-spacing: 0.14em;
            color: var(--accent);
            background: var(--bg-subtle);
            padding: 0 0.25rem;
            border-radius: 2px;
        }

        /* ── XML Output Panel ── */
        .xml-output-section {
            margin-top: 1.25rem;
        }

        .xml-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.65rem;
            flex-wrap: wrap;
        }

        .xml-status {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-light);
        }

        .xml-status.is-valid {
            color: var(--accent-2);
        }

        .xml-status.is-invalid {
            color: var(--accent);
        }

        .xml-output {
            background: var(--bg-light);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-color);
            max-height: 340px;
            overflow-y: auto;
        }

        /* ── Empty Preview ── */
        .preview-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 340px;
            border: 1.5px dashed var(--border-hairline);
            border-radius: var(--radius-md);
            background: var(--bg-light);
            color: var(--text-muted);
            gap: 0.85rem;
            text-align: center;
            padding: 2.5rem;
        }

        .preview-empty svg {
            width: 44px;
            height: 44px;
            color: var(--text-muted);
            opacity: 0.65;
        }

        .preview-empty p {
            font-size: 0.94rem;
            color: var(--text-light);
            max-width: 300px;
        }

        /* ── Toast Notification ── */
        .toast {
            position: fixed;
            bottom: 1.75rem;
            left: 50%;
            transform: translateX(-50%) translateY(72px);
            background: var(--ink);
            color: var(--bg-light);
            padding: 0.72rem 1.25rem;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            pointer-events: none;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-icon {
            display: inline-flex;
            align-items: center;
            color: var(--accent);
        }

        /* ── Responsive ── */
        @media (max-width: 960px) {
            .editor-layout {
                grid-template-columns: 1fr;
                height: auto;
                min-height: auto;
                overflow: visible;
            }

            .editor-pane {
                border-right: none;
                border-bottom: 1.5px solid var(--border-color);
            }

            .editor-pane,
            .preview-pane,
            .pane-body {
                overflow: visible;
            }

            .field-row,
            .field-row-3 {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .editor-topbar {
                padding: 0.65rem 1rem;
            }

            .pane-header {
                padding: 0.75rem 1rem;
            }

            .pane-body {
                padding: 1.15rem 1rem 1.75rem;
            }

            .preview-card {
                padding: 1.35rem 1.25rem;
            }

            .topbar-select-label {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header class="editor-topbar">
        <a href="/devlogs/" class="editor-brand" aria-label="Return to devLOGS">
            <span class="editor-brand-mark">dev<span>LOGS</span></span>
            <span class="editor-brand-sep" aria-hidden="true">/</span>
            <span class="editor-brand-sub">XML Composer</span>
        </a>

        <div class="topbar-actions">
            <div class="topbar-select-wrap">
                <label class="topbar-select-label" for="entry-loader">Load Entry</label>
                <select id="entry-loader" class="topbar-select" aria-label="Load existing entry from logs.xml">
                    <option value="">New Draft</option>
                </select>
            </div>
            <a href="/devlogs/" class="topbar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to devLOGS
            </a>
            <button type="button" class="hamburger" id="hamburger" aria-label="Open menu and theme controls" aria-expanded="false" aria-controls="burger-drawer">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div class="burger-backdrop" id="burger-backdrop" aria-hidden="true"></div>

                    </div>

                        Download .xml
                    </button>

        <!-- Preview & XML Output Pane -->

                    <button type="button" class="btn btn-secondary btn-sm" id="btn-download-xml-2">Download</button>

                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
        <span class="toast-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </span>
        <span class="toast-text"></span>
    </div>

    <script>
    (function() {
        const STORAGE_KEY = 'devlogs_editor_draft';
        let toastTimer = null;
        let existingEntries = [];

        // ── Unified Burger Drawer Theme Engine ──
        document.addEventListener('DOMContentLoaded', () => {
            if (window.PortfolioThemeEngine) {
                window.PortfolioThemeEngine.initDrawer();
            }
        });

        // ── Elements ──
        const fields = {
            title:   document.getElementById('field-title'),
            id:      document.getElementById('field-id'),
            type:    document.getElementById('field-type'),
            heading: document.getElementById('field-heading'),
            desc:    document.getElementById('field-desc'),
            content: document.getElementById('field-content'),
            date:    document.getElementById('field-date'),
            time:    document.getElementById('field-time'),
            tz:      document.getElementById('field-tz'),
        };

        const previewEmpty     = document.getElementById('preview-empty');
        const previewContainer = document.getElementById('preview-card-container');
        const xmlSection       = document.getElementById('xml-output-section');
        const xmlOutput        = document.getElementById('xml-output');
        const xmlStatus        = document.getElementById('xml-status');
        const composeStats     = document.getElementById('compose-stats');
        const entryLoader      = document.getElementById('entry-loader');

        // ── Local Storage Draft Persistence ──
        function saveDraft() {
            try {
                const data = {};
                Object.keys(fields).forEach(key => {
                    if (fields[key]) data[key] = fields[key].value;
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('Failed to save draft:', e);
            }
        }

        function loadDraft() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return false;
                const data = JSON.parse(saved);
                let hasUserText = false;
                Object.keys(fields).forEach(key => {
                    if (data[key] !== undefined && fields[key]) {
                        fields[key].value = data[key];
                        if ((key === 'title' || key === 'heading' || key === 'desc' || key === 'content') && data[key].trim()) {
                            hasUserText = true;
                        }
                    }
                });
                return hasUserText;
            } catch (e) {
                console.error('Failed to load draft:', e);
                return false;
            }
        }

        function clearDraftStorage() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {
                console.error('Failed to clear draft:', e);
            }
        }

        // ── Tag Insertion Toolbar ──
        document.getElementById('tag-bar').addEventListener('click', e => {
            const btn = e.target.closest('.tag-btn');
            if (!btn) return;

            const tag = btn.dataset.tag;
            const attrs = btn.dataset.attrs || '';
            const isVoid = btn.dataset.void === 'true';
            const ta = fields.content;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const selected = ta.value.substring(start, end);

            const insert = isVoid ? `<${tag}${attrs}/>` : `<${tag}${attrs}>${selected}</${tag}>`;
            ta.setRangeText(insert, start, end, 'end');
            if (!isVoid && !selected) {
                const cursorPos = start + `<${tag}${attrs}>`.length;
                ta.setSelectionRange(cursorPos, cursorPos);
            }
            ta.focus();
            updatePreview();
        });

        // ── Live Preview & Stats ──
        Object.values(fields).forEach(el => {
            el.addEventListener('input', updatePreview);
            el.addEventListener('change', updatePreview);
        });

        function countWords(text) {
            const plain = (text || '').replace(/<[^>]+>/g, ' ').trim();
            if (!plain) return 0;
            return plain.split(/\s+/).filter(Boolean).length;
        }

        function updatePreview() {
            const title   = fields.title.value.trim();
            const id      = fields.id.value.trim();
            const type    = fields.type.value.trim();
            const heading = fields.heading.value.trim();
            const desc    = fields.desc.value.trim();
            const content = fields.content.value;
            const tz      = fields.tz.value;

            saveDraft();

            const words = countWords(`${desc} ${content}`);
            const readMins = Math.max(1, Math.round(words / 200));
            composeStats.textContent = `${words} ${words === 1 ? 'word' : 'words'} · ${readMins} min read`;

            const hasAnything = title || id || heading || desc || content.trim();
            if (!hasAnything) {
                previewEmpty.style.display = 'flex';
                previewContainer.style.display = 'none';
                xmlSection.style.display = 'none';
                return;
            }

            previewEmpty.style.display = 'none';
            previewContainer.style.display = 'block';
            xmlSection.style.display = 'block';

            const ts = getUnixTimestamp();
            const formattedDate = ts ? formatDate(ts) : 'Draft Date';
            const processedContent = processContentPreview(content);
            const entryNum = id ? `ENTRY #${String(id).padStart(2, '0')}` : 'DRAFT';

            const metaParts = [
                `<span class="preview-kicker-id">${escHtml(entryNum)}</span>`,
                `<span>${escHtml(formattedDate)}${tz ? ` (${escHtml(tz)})` : ''}</span>`,
                `<span>${readMins} min read</span>`
            ];
            if (type) {
                metaParts.push(`<span>${escHtml(type)}</span>`);
            }

            previewContainer.innerHTML = `
                <article class="preview-card">
                    <div class="preview-kicker">
                        ${metaParts.join('<span class="preview-kicker-sep" aria-hidden="true">·</span>')}
                    </div>
                    <h2 class="preview-heading">${escHtml(heading || title || 'Untitled Entry')}</h2>
                    ${desc ? `<p class="preview-desc">${escHtml(desc)}</p>` : ''}
                    ${processedContent ? `<div class="preview-content">${processedContent}</div>` : ''}
                </article>
            `;

            const xml = generateXML();
            xmlOutput.textContent = xml;
            validateXmlSnippet(xml);
        }

        function validateXmlSnippet(xml) {
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(`<root>${xml}</root>`, 'application/xml');
                const parseErr = doc.querySelector('parsererror');
                if (parseErr) {
                    xmlStatus.textContent = 'Check HTML/XML tag nesting';
                    xmlStatus.className = 'xml-status is-invalid';
                } else {
                    xmlStatus.textContent = 'Valid XML';
                    xmlStatus.className = 'xml-status is-valid';
                }
            } catch {
                xmlStatus.textContent = 'XML Ready';
                xmlStatus.className = 'xml-status';
            }
        }

        // ── Content Processing (mirrors /devlogs/index.js) ──
        function processContentPreview(content) {
            if (!content.trim()) return '';

            content = content.replace(/<(img|input|source|embed|area|col|track)\s+([^>]*?)\/>/gi, '<$1 $2>');
            content = content.replace(/<(br|hr|wbr)\s*\/>/gi, '<$1>');

            // Multi-line full censor
            content = content.replace(/<censor>([\s\S]*?)<\/censor>/gi, (_m, p1) =>
                `<span class="censor-text" aria-label="Redacted text">${'█'.repeat(p1.replace(/\s+/g, ' ').length)}</span>`
            );

            // Multi-line partial censor
            content = content.replace(/<PCensor>([\s\S]*?)<\/PCensor>/gi, (_m, p1) => {
                return p1.split(/(\s+)/).map(token => {
                    if (/^\s+$/.test(token) || token.length <= 2) return token;
                    if (token.length === 3) return token[0] + '*' + token[2];
                    const secondToLast = token.length - 2;
                    return token.split('').map((ch, i) => (i === 0 || i === secondToLast) ? ch : '*').join('');
                }).join('');
            });

            // Multi-line & self-closing glitch (HTML-escaped output)
            const pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^*';
            content = content.replace(/<glitch\s+intensity="(\d+)">([\s\S]*?)<\/glitch>/gi, (_m, _int, txt) => {
                const source = txt || Array.from({ length: Math.floor(Math.random() * 5) + 3 }, () => pool[Math.floor(Math.random() * pool.length)]).join('');
                const rendered = source.split('').map(c => /\s/.test(c) ? c : pool[Math.floor(Math.random() * pool.length)]).join('');
                return `<span class="glitch-preview" title="Glitch effect preview">${escHtml(rendered)}</span>`;
            });
            content = content.replace(/<glitch\s+intensity="(\d+)"\s*\/>/gi, () => {
                const len = Math.floor(Math.random() * 5) + 3;
                const rendered = Array.from({ length: len }, () => pool[Math.floor(Math.random() * pool.length)]).join('');
                return `<span class="glitch-preview" title="Glitch effect preview">${escHtml(rendered)}</span>`;
            });

            // Strip script tags & inline event handlers in preview
            const tmp = document.createElement('div');
            tmp.innerHTML = content;
            tmp.querySelectorAll('script, iframe, object, embed').forEach(node => node.remove());
            tmp.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    if (attr.name.toLowerCase().startsWith('on')) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
            return tmp.innerHTML;
        }

        // ── Generate XML ──
        function escapeCdata(str) {
            return str.replace(/]]>/g, ']]]]><![CDATA[>');
        }

        function generateXML() {
            const title   = fields.title.value.trim() || '';
            const id      = fields.id.value.trim() || '';
            const type    = fields.type.value.trim();
            const heading = fields.heading.value.trim();
            const desc    = fields.desc.value.trim();
            const content = fields.content.value;
            const tz      = fields.tz.value;
            const ts      = getUnixTimestamp();

            let xml = `    <item>\n`;
            xml += `      <title>${escXml(title)}</title>\n`;
            xml += `      <id>${escXml(id)}</id>\n`;
            xml += `      <type>${escXml(type)}</type>\n`;
            xml += `      <heading>${escXml(heading)}</heading>\n`;
            xml += `      <description><![CDATA[${escapeCdata(desc)}]]></description>\n`;
            xml += `      <content>\n`;
            content.split('\n').forEach(line => {
                xml += `        ${line}\n`;
            });
            xml += `      </content>\n`;
            xml += `      <pubDate>\n`;
            xml += `        <date>${ts || ''}</date>\n`;
            xml += `        <timezone>${escXml(tz)}</timezone>\n`;
            xml += `      </pubDate>\n`;
            xml += `    </item>`;

            return xml;
        }

        function getUnixTimestamp() {
            const dateVal = fields.date.value;
            const timeVal = fields.time.value || '00:00';
            if (!dateVal) return '';
            const dt = new Date(`${dateVal}T${timeVal}:00`);
            const ms = dt.getTime();
            return Number.isNaN(ms) ? '' : Math.floor(ms / 1000);
        }

        function formatDate(ts) {
            if (!ts) return 'Unknown date';
            return new Date(parseInt(ts, 10) * 1000).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function setNow() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            fields.date.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            fields.time.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            updatePreview();
        }

        function setTimestampFields(unixSec, tz) {
            if (unixSec) {
                const d = new Date(parseInt(unixSec, 10) * 1000);
                if (!Number.isNaN(d.getTime())) {
                    const pad = n => String(n).padStart(2, '0');
                    fields.date.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
                    fields.time.value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
                }
            }
            if (tz && Array.from(fields.tz.options).some(opt => opt.value === tz)) {
                fields.tz.value = tz;
            }
        }

        // ── Copy & Download XML ──
        async function copyXML() {
            const title = fields.title.value.trim();
            const id = fields.id.value.trim();
            if (!title || !id) {
                showToast('Title and ID are required before copying XML');
                return;
            }
            const xml = generateXML();
            try {
                await navigator.clipboard.writeText(xml);
                showToast('XML snippet copied to clipboard');
            } catch {
                const ta = document.createElement('textarea');
                ta.value = xml;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('XML snippet copied to clipboard');
            }
        }

        function downloadXML() {
            const title = fields.title.value.trim();
            const id = fields.id.value.trim();
            if (!title || !id) {
                showToast('Title and ID are required before downloading');
                return;
            }
            const xml = generateXML() + '\n';
            const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `devlog-entry-${id}.xml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Downloaded devlog-entry-${id}.xml`);
        }

        // ── Load logs.xml for Next ID & Entry Picker ──
        async function loadLogsCatalog(forceNextId = false) {
            try {
                const resp = await fetch('logs.xml');
                if (!resp.ok) return;
                const xmlText = await resp.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
                const items = Array.from(xmlDoc.querySelectorAll('item'));
                const serializer = new XMLSerializer();

                let maxId = 0;
                existingEntries = items.map(item => {
                    const idStr = item.querySelector('id')?.textContent?.trim() || '';
                    const num = parseInt(idStr, 10);
                    if (!Number.isNaN(num) && num > maxId) maxId = num;

                    const contentEl = item.querySelector('content');
                    let rawContent = '';
                    if (contentEl) {
                        rawContent = Array.from(contentEl.childNodes)
                            .map(node => node.nodeType === Node.TEXT_NODE ? node.textContent : serializer.serializeToString(node))
                            .join('')
                            .replace(/ xmlns="[^"]*"/g, '')
                            .trim();
                    }

                    return {
                        id: idStr,
                        title: item.querySelector('title')?.textContent?.trim() || 'Untitled',
                        type: item.querySelector('type')?.textContent?.trim() || '',
                        heading: item.querySelector('heading')?.textContent?.trim() || '',
                        desc: item.querySelector('description')?.textContent?.trim() || '',
                        content: rawContent,
                        date: item.querySelector('pubDate > date')?.textContent?.trim() || '',
                        tz: item.querySelector('pubDate > timezone')?.textContent?.trim() || 'IST'
                    };
                });

                // Populate entry loader select once
                entryLoader.innerHTML = '<option value="">New Draft</option>';
                existingEntries.forEach(entry => {
                    const opt = document.createElement('option');
                    opt.value = entry.id;
                    opt.textContent = `#${entry.id} — ${entry.title}`;
                    entryLoader.appendChild(opt);
                });

                const nextId = maxId + 1;
                if (forceNextId || !fields.id.value) {
                    fields.id.value = nextId;
                    updatePreview();
                }
            } catch (e) {
                console.error('Failed to read logs.xml:', e);
            }
        }

        entryLoader.addEventListener('change', () => {
            const selectedId = entryLoader.value;
            if (!selectedId) {
                clearAll(false);
                return;
            }
            const entry = existingEntries.find(e => e.id === selectedId);
            if (!entry) return;
            fields.title.value = entry.title;
            fields.id.value = entry.id;
            fields.type.value = entry.type;
            fields.heading.value = entry.heading;
            fields.desc.value = entry.desc;
            fields.content.value = entry.content;
            setTimestampFields(entry.date, entry.tz);
            updatePreview();
            showToast(`Loaded entry #${entry.id} into composer`);
        });

        async function clearAll(notify = true) {
            Object.values(fields).forEach(el => {
                if (el.tagName === 'SELECT') el.selectedIndex = 0;
                else el.value = '';
            });
            entryLoader.value = '';
            clearDraftStorage();
            setNow();
            await loadLogsCatalog(true);
            updatePreview();
            if (notify) showToast('Draft cleared and ID reset');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.querySelector('.toast-text').textContent = message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
                toastTimer = null;
            }, 2600);
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function escXml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        // ── Wire Events ──
        document.getElementById('btn-copy-xml').addEventListener('click', copyXML);
        document.getElementById('btn-copy-xml-2').addEventListener('click', copyXML);
        document.getElementById('btn-download-xml').addEventListener('click', downloadXML);
        document.getElementById('btn-download-xml-2').addEventListener('click', downloadXML);
        document.getElementById('btn-now').addEventListener('click', setNow);
        document.getElementById('btn-clear').addEventListener('click', () => clearAll(true));

        async function initEditor() {
            const restored = loadDraft();
            if (!restored) {
                setNow();
            } else {
                showToast('Restored draft from local cache');
            }
            await loadLogsCatalog(false);
            updatePreview();
        }

        initEditor();
    })();
    </script>
</body>
</html>

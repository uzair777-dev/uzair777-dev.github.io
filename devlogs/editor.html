<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="devLOGS XML Editor Utility for composing blog post entries.">
    <meta name="robots" content="noindex, nofollow">
    <title>devLOGS Editor — Uzair Shaikh</title>
    <link rel="stylesheet" href="/styles.css">
    
    <!-- Standardized Favicons -->
    <link rel="icon" type="image/x-icon" href="/res/img/bot.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/res/img/bot.png">
    <link rel="icon" type="image/svg+xml" href="/res/svg/bot.svg">
    <link rel="apple-touch-icon" href="/res/img/bot.png">
    <style>
    /* ═══════════════════════════════════════════════
       Editor — Self-contained styles
       Inherits CSS variables from /styles.css
       ═══════════════════════════════════════════════ */

    body {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── Top Bar ── */
    .editor-topbar {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 2rem;
        background: var(--bg-light);
        border-bottom: 1px solid var(--border-color);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .editor-topbar .logo {
        font-size: 1.25rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .editor-topbar .logo .badge {
        font-size: 0.6rem;
        padding: 0.15rem 0.5rem;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        border-radius: 100px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        -webkit-text-fill-color: white;
    }

    .topbar-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    /* ── Theme Toggle (minimal) ── */
    .theme-btn {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        cursor: pointer;
        color: var(--text-color);
        transition: all 0.2s ease;
    }

    .theme-btn:hover {
        background: var(--hover-color);
        border-color: var(--primary-color);
    }

    .theme-btn svg {
        width: 18px;
        height: 18px;
    }

    .theme-btn .icon-moon { display: none; }
    [data-theme="dark"] .theme-btn .icon-sun { display: none; }
    [data-theme="dark"] .theme-btn .icon-moon { display: block; }

    /* ── Layout ── */
    .editor-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        height: calc(100vh - 53px);
        overflow: hidden;
    }

    .editor-pane, .preview-pane {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .editor-pane {
        border-right: 1px solid var(--border-color);
    }

    .pane-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.25rem;
        background: var(--bg-light);
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
    }

    .pane-title {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-light);
    }

    .pane-body {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
    }

    /* ── Form Fields ── */
    .field-group {
        margin-bottom: 1.25rem;
    }

    .field-group label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-light);
        margin-bottom: 0.4rem;
    }

    .field-group label .req {
        color: #ef4444;
        margin-left: 0.15rem;
    }

    .field-group label .hint {
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        opacity: 0.7;
        font-size: 0.75rem;
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
        width: 100%;
        padding: 0.65rem 0.9rem;
        background: var(--bg-color);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        font-size: 0.92rem;
        font-family: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        outline: none;
    }

    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .field-group textarea {
        resize: vertical;
        min-height: 100px;
        font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        line-height: 1.6;
    }

    .field-group textarea.content-area {
        min-height: 220px;
    }

    .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .field-row-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1rem;
    }

    /* ── Tag Insert Bar ── */
    .tag-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-bottom: 0.75rem;
    }

    .tag-btn {
        padding: 0.3rem 0.65rem;
        font-size: 0.72rem;
        font-weight: 600;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-light);
        color: var(--text-light);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .tag-btn:hover {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        border-color: transparent;
        transform: translateY(-1px);
    }

    .tag-btn.custom {
        border-color: var(--primary-color);
        color: var(--primary-color);
    }

    .tag-btn.custom:hover {
        color: white;
    }

    /* ── Action Buttons ── */
    .actions {
        display: flex;
        gap: 0.75rem;
        padding-top: 0.5rem;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.5rem;
        font-size: 0.88rem;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        box-shadow: 0 2px 12px rgba(99, 102, 241, 0.25);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
        background: var(--bg-light);
        color: var(--text-color);
        border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
    }

    .btn-danger {
        background: rgba(239, 68, 68, 0.08);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-danger:hover {
        background: #ef4444;
        color: white;
        border-color: transparent;
    }

    /* ── Preview ── */
    .preview-card {
        background: var(--bg-light);
        border-radius: 16px;
        padding: 2rem;
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
        margin-bottom: 1.5rem;
    }

    .preview-card .preview-heading {
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0 0 0.75rem;
        line-height: 1.3;
    }

    .preview-card .preview-meta {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
    }

    .preview-card .preview-date {
        font-size: 0.85rem;
        color: var(--text-light);
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }

    .preview-card .preview-date::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--primary-color);
    }

    .preview-card .preview-type-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 100px;
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
        color: var(--primary-color);
        border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .preview-card .preview-desc {
        color: var(--text-light);
        line-height: 1.7;
        font-size: 0.95rem;
        margin-bottom: 1rem;
    }

    .preview-card .preview-content {
        line-height: 1.9;
        font-size: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
    }

    /* Content styles matching overlay-body in devlogs/styles.css */
    .preview-content img { max-width: 100%; height: auto; border-radius: 10px; margin: 1rem 0; display: block; }
    .preview-content a { color: var(--primary-color); text-decoration: underline; font-weight: 500; }
    .preview-content hr { border: none; height: 1px; background: linear-gradient(to right, transparent, var(--border-color), var(--primary-color), var(--border-color), transparent); margin: 2rem 0; }
    .preview-content ul, .preview-content ol { padding-left: 1.5rem; margin: 0.75rem 0; }
    .preview-content li { margin: 0.35rem 0; }
    .preview-content ul li::marker { color: var(--primary-color); }
    .preview-content blockquote { border-left: 3px solid var(--primary-color); margin: 1rem 0; padding: 0.75rem 1.25rem; background: rgba(99, 102, 241, 0.04); border-radius: 0 8px 8px 0; font-style: italic; color: var(--text-light); }
    .preview-content code { background: rgba(99, 102, 241, 0.08); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; font-family: 'SF Mono', 'Fira Code', monospace; border: 1px solid rgba(99, 102, 241, 0.12); }
    .preview-content br { display: block; content: ""; margin-top: 0.5rem; }
    .preview-content p { margin: 0.75rem 0; }

    /* Censor styles */
    .censor-text { letter-spacing: 0; user-select: none; }

    /* ── XML Output ── */
    .xml-output-section {
        margin-top: 1.5rem;
    }

    .xml-output-section .pane-title {
        margin-bottom: 0.75rem;
    }

    .xml-output {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1rem;
        font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text-color);
        max-height: 350px;
        overflow-y: auto;
        position: relative;
    }

    /* ── Toast Notification ── */
    .toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--bg-light);
        color: var(--text-color);
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        z-index: 10000;
        opacity: 0;
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }

    .toast .toast-icon {
        font-size: 1.1rem;
    }

    /* ── Empty Preview ── */
    .preview-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-light);
        opacity: 0.5;
        gap: 1rem;
        text-align: center;
        padding: 2rem;
    }

    .preview-empty svg {
        width: 64px;
        height: 64px;
        opacity: 0.4;
    }

    .preview-empty p {
        font-size: 0.95rem;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
        .editor-layout {
            grid-template-columns: 1fr;
            height: auto;
            overflow: visible;
        }

        .editor-pane {
            border-right: none;
            border-bottom: 1px solid var(--border-color);
        }

        .pane-body {
            overflow-y: visible;
        }

        .field-row, .field-row-3 {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 480px) {
        .editor-topbar {
            padding: 0.5rem 1rem;
        }
        .pane-body {
            padding: 1rem;
        }
    }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="editor-topbar">
        <span class="logo">
            devLOGS <span class="badge">Editor</span>
        </span>
        <div class="topbar-actions">
            <button class="theme-btn" id="theme-btn" aria-label="Toggle theme">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="editor-layout">

        <!-- ═══ Editor Pane ═══ -->
        <div class="editor-pane">
            <div class="pane-header">
                <span class="pane-title">✏️ Compose</span>
            </div>
            <div class="pane-body">

                <!-- Title -->
                <div class="field-group">
                    <label for="field-title">Title <span class="req">*</span></label>
                    <input type="text" id="field-title" placeholder="e.g. My dev logs">
                </div>

                <!-- ID & Type -->
                <div class="field-row">
                    <div class="field-group">
                        <label for="field-id">ID <span class="req">*</span> <span class="hint">(unique number)</span></label>
                        <input type="number" id="field-id" placeholder="e.g. 4" min="1">
                    </div>
                    <div class="field-group">
                        <label for="field-type">Type <span class="hint">(optional category)</span></label>
                        <input type="text" id="field-type" placeholder="e.g. update, tech">
                    </div>
                </div>

                <!-- Heading -->
                <div class="field-group">
                    <label for="field-heading">Heading <span class="hint">(displayed in overlay)</span></label>
                    <input type="text" id="field-heading" placeholder="e.g. Example heading, idk">
                </div>

                <!-- Description -->
                <div class="field-group">
                    <label for="field-desc">Description <span class="hint">(short, single line — wrapped in CDATA)</span></label>
                    <textarea id="field-desc" rows="2" placeholder="A brief summary shown on the card..."></textarea>
                </div>

                <!-- Content -->
                <div class="field-group">
                    <label for="field-content">Content <span class="hint">(HTML + custom tags allowed)</span></label>
                    <div class="tag-bar" id="tag-bar">
                        <button class="tag-btn" data-tag="b" title="Bold">B</button>
                        <button class="tag-btn" data-tag="i" title="Italic">I</button>
                        <button class="tag-btn" data-tag="u" title="Underline">U</button>
                        <button class="tag-btn" data-tag="a" data-attrs=' href="" target="_blank"' title="Link">a</button>
                        <button class="tag-btn" data-tag="br" data-void="true" title="Line break">br</button>
                        <button class="tag-btn" data-tag="hr" data-void="true" title="Horizontal rule">hr</button>
                        <button class="tag-btn" data-tag="p" title="Paragraph">p</button>
                        <button class="tag-btn" data-tag="blockquote" title="Blockquote">quote</button>
                        <button class="tag-btn" data-tag="code" title="Inline code">code</button>
                        <button class="tag-btn" data-tag="ul" title="Unordered list">ul</button>
                        <button class="tag-btn" data-tag="li" title="List item">li</button>
                        <button class="tag-btn" data-tag="img" data-void="true" data-attrs=' src="" alt=""' title="Image">img</button>
                        <button class="tag-btn custom" data-tag="censor" title="Full censor — replaces every char with █">censor</button>
                        <button class="tag-btn custom" data-tag="PCensor" title="Partial censor — first + second-to-last char visible">PCensor</button>
                        <button class="tag-btn custom" data-tag="glitch" data-attrs=' intensity="5"' title="Glitch text">glitch</button>
                    </div>
                    <textarea id="field-content" class="content-area" placeholder="Write your content here...&#10;Supports HTML tags, <br/>, <hr/>, <img>, etc.&#10;Custom: <censor>, <PCensor>, <glitch intensity=&quot;5&quot;>"></textarea>
                </div>

                <!-- Pub Date -->
                <div class="field-row-3">
                    <div class="field-group">
                        <label for="field-date">Date</label>
                        <input type="date" id="field-date">
                    </div>
                    <div class="field-group">
                        <label for="field-time">Time</label>
                        <input type="time" id="field-time">
                    </div>
                    <div class="field-group">
                        <label for="field-tz">Timezone</label>
                        <select id="field-tz">
                            <option value="IST" selected>IST</option>
                            <option value="UTC">UTC</option>
                            <option value="EST">EST</option>
                            <option value="PST">PST</option>
                            <option value="GMT">GMT</option>
                            <option value="CET">CET</option>
                            <option value="JST">JST</option>
                        </select>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button class="btn btn-primary" id="btn-copy-xml">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy XML
                    </button>
                    <button class="btn btn-secondary" id="btn-now">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        Set Now
                    </button>
                    <button class="btn btn-danger" id="btn-clear">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Clear
                    </button>
                </div>
            </div>
        </div>

        <!-- ═══ Preview Pane ═══ -->
        <div class="preview-pane">
            <div class="pane-header">
                <span class="pane-title">👁️ Live Preview</span>
                <button class="btn btn-secondary" id="btn-copy-xml-2" style="padding: 0.4rem 0.9rem; font-size: 0.78rem;">Copy XML</button>
            </div>
            <div class="pane-body" id="preview-body">
                <div class="preview-empty" id="preview-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                    <p>Start typing to see your devlog preview here</p>
                </div>
                <div id="preview-card-container" style="display:none;"></div>

                <!-- XML Output -->
                <div class="xml-output-section" id="xml-output-section" style="display:none;">
                    <span class="pane-title">📋 XML Output (copy this into logs.xml)</span>
                    <pre class="xml-output" id="xml-output"></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="toast-icon">✅</span>
        <span class="toast-text"></span>
    </div>

    <script>
    // ═══════════════════════════════════════════════
    //  Editor Logic
    // ═══════════════════════════════════════════════

    const STORAGE_KEY = 'devlogs_editor_draft';

    // ── Theme ──
    (function initTheme() {
        const saved = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', saved);
    })();

    document.getElementById('theme-btn').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });

    // ── Elements ──
    const fields = {
        title:   document.getElementById('field-title'),
        id:      document.getElementById('field-id'),
        type:    document.getElementById('field-type'),
        heading: document.getElementById('field-heading'),
        desc:    document.getElementById('field-desc'),
        content: document.getElementById('field-content'),
        date:    document.getElementById('field-date'),
        time:    document.getElementById('field-time'),
        tz:      document.getElementById('field-tz'),
    };

    const previewBody       = document.getElementById('preview-body');
    const previewEmpty      = document.getElementById('preview-empty');
    const previewContainer  = document.getElementById('preview-card-container');
    const xmlSection        = document.getElementById('xml-output-section');
    const xmlOutput         = document.getElementById('xml-output');

    // ── Local Storage Caching ──
    function saveDraft() {
        try {
            const data = {};
            Object.keys(fields).forEach(key => {
                if (fields[key]) {
                    data[key] = fields[key].value;
                }
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            console.error('Failed to save draft to localStorage:', e);
        }
    }

    function loadDraft() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            const data = JSON.parse(saved);
            let hasValue = false;
            Object.keys(fields).forEach(key => {
                if (data[key] !== undefined && fields[key]) {
                    fields[key].value = data[key];
                    if (data[key]) hasValue = true;
                }
            });
            return hasValue;
        } catch (e) {
            console.error('Failed to load draft from localStorage:', e);
            return false;
        }
    }

    function clearDraftStorage() {
        try {
            localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
            console.error('Failed to clear draft from localStorage:', e);
        }
    }

    // ── Tag Insertion ──
    document.getElementById('tag-bar').addEventListener('click', e => {
        const btn = e.target.closest('.tag-btn');
        if (!btn) return;

        const tag   = btn.dataset.tag;
        const attrs = btn.dataset.attrs || '';
        const isVoid = btn.dataset.void === 'true';
        const ta    = fields.content;
        const start = ta.selectionStart;
        const end   = ta.selectionEnd;
        const selected = ta.value.substring(start, end);

        let insert;
        if (isVoid) {
            insert = `<${tag}${attrs}/>`;
        } else {
            insert = `<${tag}${attrs}>${selected}</${tag}>`;
        }

        ta.setRangeText(insert, start, end, 'end');
        ta.focus();
        updatePreview();
    });

    // ── Live Preview on any input ──
    Object.values(fields).forEach(el => {
        el.addEventListener('input', updatePreview);
        el.addEventListener('change', updatePreview);
    });

    function updatePreview() {
        const title   = fields.title.value.trim();
        const id      = fields.id.value.trim();
        const type    = fields.type.value.trim();
        const heading = fields.heading.value.trim();
        const desc    = fields.desc.value.trim();
        const content = fields.content.value;
        const tz      = fields.tz.value;

        // Auto-save draft to local storage whenever inputs change
        saveDraft();

        const hasAnything = title || id || heading || desc || content;

        if (!hasAnything) {
            previewEmpty.style.display = 'flex';
            previewContainer.style.display = 'none';
            xmlSection.style.display = 'none';
            return;
        }

        previewEmpty.style.display = 'none';
        previewContainer.style.display = 'block';
        xmlSection.style.display = 'block';

        // Build unix timestamp
        const ts = getUnixTimestamp();
        const formattedDate = ts ? formatDate(ts) : 'No date set';

        // Process content for preview (mimic processContent from index.js)
        const processedContent = processContentPreview(content);

        // Render preview card
        previewContainer.innerHTML = `
            <div class="preview-card">
                <h2 class="preview-heading">${escHtml(heading || title || 'Untitled')}</h2>
                <div class="preview-meta">
                    <span class="preview-date">${formattedDate}${tz ? ` (${tz})` : ''}</span>
                    ${type ? `<span class="preview-type-badge">${escHtml(type)}</span>` : ''}
                </div>
                ${desc ? `<p class="preview-desc">${escHtml(desc)}</p>` : ''}
                ${processedContent ? `<div class="preview-content">${processedContent}</div>` : ''}
            </div>
        `;

        // Render XML output
        xmlOutput.textContent = generateXML();
    }

    // ── Content Processing (mirrors index.js processContent) ──
    function processContentPreview(content) {
        if (!content.trim()) return '';

        // Normalise void tags
        content = content.replace(/<(img|input|source|embed|area|col|track)\s+([^>]*?)\/>/gi, '<$1 $2>');
        content = content.replace(/<(br|hr|wbr)\s*\/>/gi, '<$1>');

        // Full censor
        content = content.replace(/<censor>(.*?)<\/censor>/gi, (_m, p1) =>
            `<span class="censor-text">${'█'.repeat(p1.length)}</span>`
        );

        // Partial censor
        content = content.replace(/<PCensor>(.*?)<\/PCensor>/gi, (_m, p1) => {
            return p1.split(' ').map(word => {
                if (word.length <= 2) return word;
                if (word.length === 3) return word[0] + '*' + word[2];
                const secondToLast = word.length - 2;
                return word.split('').map((ch, i) => {
                    if (i === 0 || i === secondToLast) return ch;
                    return '*';
                }).join('');
            }).join(' ');
        });

        // Glitch (simplified — no custom fonts in editor)
        const pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        content = content.replace(/<glitch\s+intensity="(\d+)">(.*?)<\/glitch>/gi, (_m, int, txt) => {
            const chars = txt || Array.from({length: Math.floor(Math.random() * 5) + 3}, () => pool[Math.floor(Math.random() * pool.length)]).join('');
            const speed = Math.max(0.08, 0.6 - parseInt(int) * 0.05);
            return `<span style="opacity:0.6;font-family:monospace;letter-spacing:2px;" title="[glitch effect]">${chars.split('').map(c => c === ' ' ? ' ' : pool[Math.floor(Math.random() * pool.length)]).join('')}</span>`;
        });
        content = content.replace(/<glitch\s+intensity="(\d+)"\s*\/>/gi, (_m, int) => {
            const len = Math.floor(Math.random() * 5) + 3;
            const chars = Array.from({length: len}, () => pool[Math.floor(Math.random() * pool.length)]).join('');
            return `<span style="opacity:0.6;font-family:monospace;letter-spacing:2px;" title="[glitch effect]">${chars}</span>`;
        });

        // Sanitise through a temp element
        const tmp = document.createElement('div');
        tmp.innerHTML = content;
        return tmp.innerHTML;
    }

    // ── Generate XML ──
    function generateXML() {
        const title   = fields.title.value.trim() || '';
        const id      = fields.id.value.trim() || '';
        const type    = fields.type.value.trim();
        const heading = fields.heading.value.trim();
        const desc    = fields.desc.value.trim();
        const content = fields.content.value;
        const tz      = fields.tz.value;
        const ts      = getUnixTimestamp();

        // Build the <item> XML block
        let xml = `    <item>\n`;
        xml += `      <title>${escXml(title)}</title>\n`;
        xml += `      <id>${escXml(id)}</id>\n`;
        xml += `      <type>${escXml(type)}</type>\n`;
        xml += `      <heading>${escXml(heading)}</heading>\n`;
        xml += `      <description><![CDATA[${desc}]]></description>\n`;
        xml += `      <content>\n`;
        // Indent each line of content
        const contentLines = content.split('\n');
        contentLines.forEach(line => {
            xml += `        ${line}\n`;
        });
        xml += `      </content>\n`;
        xml += `      <pubDate>\n`;
        xml += `        <date>${ts || ''}</date>\n`;
        xml += `        <timezone>${escXml(tz)}</timezone>\n`;
        xml += `      </pubDate>\n`;
        xml += `    </item>`;

        return xml;
    }

    // ── Get unix timestamp from date/time fields ──
    function getUnixTimestamp() {
        const dateVal = fields.date.value;
        const timeVal = fields.time.value || '00:00';
        if (!dateVal) return '';

        const dt = new Date(`${dateVal}T${timeVal}:00`);
        return Math.floor(dt.getTime() / 1000);
    }

    // ── Format date (mirrors index.js) ──
    function formatDate(ts) {
        if (!ts) return 'Unknown date';
        return new Date(parseInt(ts) * 1000).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    // ── Set Now ──
    function setNow() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        fields.date.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        fields.time.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        updatePreview();
    }

    // ── Copy XML ──
    async function copyXML() {
        const title = fields.title.value.trim();
        const id    = fields.id.value.trim();

        if (!title || !id) {
            showToast('⚠️', 'Title and ID are required');
            return;
        }

        const xml = generateXML();
        try {
            await navigator.clipboard.writeText(xml);
            showToast('✅', 'XML copied to clipboard!');
        } catch {
            // Fallback
            const ta = document.createElement('textarea');
            ta.value = xml;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅', 'XML copied to clipboard!');
        }
    }

    // ── Clear all fields ──
    function clearAll() {
        Object.values(fields).forEach(el => {
            if (el.tagName === 'SELECT') {
                el.selectedIndex = 0;
            } else {
                el.value = '';
            }
        });
        clearDraftStorage();
        setNow();
        updatePreview();
        showToast('🗑️', 'Fields & cached draft cleared');
    }

    // ── Toast ──
    function showToast(icon, message) {
        const toast = document.getElementById('toast');
        toast.querySelector('.toast-icon').textContent = icon;
        toast.querySelector('.toast-text').textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ── Escape helpers ──
    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    function escXml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
    }

    // ── Button Events ──
    document.getElementById('btn-copy-xml').addEventListener('click', copyXML);
    document.getElementById('btn-copy-xml-2').addEventListener('click', copyXML);
    document.getElementById('btn-now').addEventListener('click', setNow);
    document.getElementById('btn-clear').addEventListener('click', clearAll);

    // ── Initialize Editor & Load Cached Draft ──
    const restored = loadDraft();
    if (!restored) {
        setNow();
    } else {
        showToast('💾', 'Restored draft from local cache');
    }
    updatePreview();
    </script>
</body>
</html>

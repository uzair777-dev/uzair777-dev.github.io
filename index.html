    <!-- Theme & Palette Inline Initialization (prevents FOUC) -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var resolved = (saved === 'light' || saved === 'dark') ? saved :
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                var pal = localStorage.getItem('themeActivePalette') || localStorage.getItem('themePalette') || 'jade';
                document.documentElement.setAttribute('data-theme', resolved);
                document.documentElement.setAttribute('data-palette', pal);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.setAttribute('data-palette', 'jade');
            }
        })();
    </script>

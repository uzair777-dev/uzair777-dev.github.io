    <!-- Theme, Solar Palette & Cross-Page Curtain Handoff Inline Initialization (prevents FOUC) -->
    <script>
        (function() {
            window.__preloaderStartTime = performance.now();
            try {
                var saved = localStorage.getItem('theme');
                var resolved = (saved === 'light' || saved === 'dark') ? saved :
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                var h = new Date().getHours();
                var pal = (h >= 5 && h <= 10) ? 'dawn' : (h >= 11 && h <= 16) ? 'noon' : (h >= 17 && h <= 20) ? 'dusk' : 'night';
                document.documentElement.setAttribute('data-theme', resolved);
                document.documentElement.setAttribute('data-palette', pal);
                var rawHandoff = sessionStorage.getItem('portfolio_curtain_handoff');
                if (rawHandoff && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
                    var parsed = JSON.parse(rawHandoff);
                    if (parsed && parsed.label && (Date.now() - parsed.ts) < 4500) {
                        document.documentElement.setAttribute('data-curtain-handoff', parsed.label);
                    }
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.setAttribute('data-palette', 'dusk');
            }
        })();
    </script>

    <!-- Critical inline CSS so the themed Solar Preloader paints on packet 1 (zero wait for 90KB styles.css or JS) -->
    <style id="critical-preloader-css">
        :root{--bg-color:#fdf6f1;--ink:#231b1a;--text-light:#736461;--accent:#e07b6d;--accent-2:#a286e8;--border-hairline:#f0dcd4}
        :root[data-palette="dawn"]{--bg-color:#fff6f0;--ink:#271a16;--text-light:#7d625a;--accent:#e06f5d;--accent-2:#9e78db;--border-hairline:#f0dcd2}
        :root[data-palette="noon"]{--bg-color:#fdf9f0;--ink:#1f1c14;--text-light:#716754;--accent:#d2872a;--accent-2:#4f97b8;--border-hairline:#ede3ce}
        :root[data-palette="night"]{--bg-color:#f3f5fc;--ink:#171c2b;--text-light:#5b6582;--accent:#6874dc;--accent-2:#3ea3b5;--border-hairline:#d8dff2}
        :root[data-theme="dark"]{--bg-color:#1a1516;--ink:#f5eae4;--text-light:#baa7a1;--accent:#f2a08c;--accent-2:#c7aefc;--border-hairline:#382e31}
        :root[data-theme="dark"][data-palette="dawn"]{--bg-color:#1b1514;--ink:#f8ece5;--text-light:#c0a69c;--accent:#f59f88;--accent-2:#d0aff8;--border-hairline:#3a2e2b}
        :root[data-theme="dark"][data-palette="noon"]{--bg-color:#181713;--ink:#f6f0e2;--text-light:#b6ac94;--accent:#f0b960;--accent-2:#7ec9e6;--border-hairline:#343127}
        :root[data-theme="dark"][data-palette="night"]{--bg-color:#111420;--ink:#eaeefa;--text-light:#9da9c7;--accent:#9aa8ff;--accent-2:#7ad8e8;--border-hairline:#272e45}
        html,body{margin:0;padding:0;background:var(--bg-color);color:var(--ink)}
        #preloader.site-preloader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:var(--bg-color);transition:opacity .4s ease,visibility .4s ease}
        #preloader.site-preloader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
        html[data-curtain-handoff] #preloader.site-preloader{display:none!important}
        .preloader-inner,.solar-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.85rem;text-align:center}
        .solar-loader-svg{width:68px;height:68px;display:block;overflow:visible}
        .solar-loader-label{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light)}
        .sl-fast-orbit{transform-origin:34px 34px;animation:slFastSpin 3.2s linear infinite}
        .sl-fast-pulse{transform-origin:34px 34px;animation:slFastPulse 2s ease-in-out infinite}
        @keyframes slFastSpin{to{transform:rotate(360deg)}}
        @keyframes slFastPulse{0%,100%{transform:scale(.94);opacity:.78}50%{transform:scale(1.06);opacity:1}}
        @media (prefers-reduced-motion:reduce){.sl-fast-orbit,.sl-fast-pulse{animation:none!important}}
    </style>

    <!-- Non-blocking main stylesheet (downloads at high priority in parallel while inline preloader paints on packet 1) -->

    <script>
